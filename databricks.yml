# Bundle do ACELERADOR RC18 (rc18-starter-kit).
#
# Self-contained: provisiona catálogo + warehouse + schemas + volumes + pipelines
# (bronze/silver/gold) + dashboards + setup job + app. O setup job semeia o
# schema reference E carrega os XMLs de exemplo em sample/ para o landing volume,
# permitindo rodar fim-a-fim com `databricks bundle deploy` apenas.
#
# ── Dois modos de pipeline (bronze→silver→gold) ──────────────────────────────
# O mesmo medallion pode ser orquestrado de duas formas mutuamente exclusivas,
# selecionadas pela variável `pipeline_mode` + o bloco `include:` abaixo:
#
#   • classical (DEFAULT, `pipeline_mode: classical`) — jobs Databricks clássicos
#     rodando notebooks PySpark (spark.read/write + saveAsTable). NENHUM recurso
#     SDP/DLT é deployado. Para clientes que não podem/querem usar SDP/DLT.
#   • sdp (`pipeline_mode: sdp`) — pipelines DLT/SDP declarativas (caminho
#     original). Opt-in: exige (des)comentar linhas no `include:` abaixo.
#
# DABs não remove recursos condicionalmente por variável, então a troca REAL é
# feita comentando/descomentando os includes de pipeline — mesmo idioma usado
# para BYOC catálogo/warehouse (comentar resources/{catalog,warehouse}.yml).
#
# Customers que já possuem catálogo/warehouse configuram `catalog` e
# `warehouse_id` no target.yml; nesse caso comentar
# resources/{catalog,warehouse}.yml para o bundle não gerenciar assets externos.
#
# Para o bundle de demo (mock app + geradores sintéticos), ver demo/databricks.yml.

bundle:
  name: rc18-starter-kit
  # Direct deployment engine é OBRIGATÓRIO por causa do recurso `catalogs:`
  # (o Terraform engine falha com "Catalog resources are only supported with
  # direct deployment mode"). Declarado aqui para que `databricks bundle ...`
  # nativo funcione sem env var/wrapper — tem prioridade sobre
  # DATABRICKS_BUNDLE_ENGINE.
  engine: direct

include:
  # Single default target. Copy target.yml.example to the git-ignored target.yml.
  - target.yml

  # Recursos SEMPRE presentes, independentes do modo de pipeline:
  # app, catálogo, warehouse, setup job, schemas/volumes UC (resources/*.yml)
  # + dashboards Lakeview (resources/analytics/).
  - resources/*.yml
  - resources/analytics/*.yml

  # ── Modo de pipeline bronze→silver→gold (escolha UM bloco) ────────────────
  # DEFAULT: pipelines CLÁSSICAS — job + notebooks PySpark, ZERO recursos
  # SDP/DLT. Combina com `pipeline_mode: classical` (default da variável).
  - resources/classical/*.yml

  # OPT-IN: pipelines SDP/DLT (caminho declarativo original). Para trocar o
  # modo classical → sdp:
  #   1. defina `pipeline_mode: sdp` no target.yml (documentação/telemetria)
  #   2. comente a linha `resources/classical/*.yml` acima
  #   3. descomente a linha `resources/pipelines/*.yml` abaixo
  # Assim NENHUM recurso do outro modo é deployado (DABs não remove recursos
  # condicionalmente por variável — a troca é feita via este include).
  # - resources/pipelines/*.yml

sync:
  # Inclui apenas o que o bundle precisa (evita subir docs/, demo/, .venv/, etc.)
  paths:
    - app
    - notebooks
    - pipelines
    - dashboards
    - resources
    - sample
  exclude:
    - "**/node_modules/"
    - "**/__pycache__/"
    - "**/*.pyc"
    - "**/.DS_Store"

variables:
  pipeline_mode:
    description: |
      Modo de orquestração do medallion bronze→silver→gold. Um de:
        • classical (DEFAULT) — jobs Databricks clássicos + notebooks PySpark,
          SEM nenhum recurso SDP/DLT. Para clientes que não podem usar SDP/DLT.
        • sdp — pipelines DLT/SDP declarativas (caminho original, opt-in).
      IMPORTANTE: DABs não remove recursos condicionalmente por variável. Esta
      variável documenta/telemetriza a escolha; a troca EFETIVA dos recursos é
      feita no bloco `include:` deste arquivo (comentar resources/classical/*.yml
      e descomentar resources/pipelines/*.yml, ou vice-versa).
    default: "classical"

  catalog:
    default: "rc18_catalog"
    description: "Unity Catalog name. Omit in target.yml to provision and use rc18_catalog."

  warehouse_id:
    description: "SQL Warehouse ID. Omit in target.yml to provision and use the bundle-managed Serverless 2X-Small warehouse."
    default: ${resources.sql_warehouses.rc18_warehouse.id}

  genie_space_id:
    description: "Genie Space ID. Sentinela __unset__ = Genie desativado (placeholder no app). Setar no target.yml após criar o space via bundle genie/."
    default: "__unset__"

  app_name:
    default: "rc18-starter-kit"

  schema_bronze:
    default: "bronze"
  schema_silver:
    default: "silver"
  schema_gold:
    default: "gold"
  schema_quality:
    default: "quality"

  dqx_catalog:
    description: |
      Unity Catalog de VÍNCULO com a DQX Studio (env var `DQX_CATALOG` no app
      databrickslabs/dqx). É onde a Studio persiste as regras — o backend RC18
      lê de `${dqx_catalog}.${dqx_schema}.dq_quality_rules`. Ajuste no target.yml
      quando a Studio vive em outro catálogo que não o default.
    default: "dqx"

  dqx_schema:
    description: |
      Schema da DQX Studio dentro de `${var.dqx_catalog}` (env var `DQX_SCHEMA`
      no app databrickslabs/dqx). Junto com o catálogo forma o FQN da tabela de
      regras.
    default: "dqx_studio"

  dqx_checks_table:
    description: |
      FQN completo da tabela onde a DQX Studio armazena as regras. Composto por
      padrão a partir de `dqx_catalog` + `dqx_schema` (tabela `dq_quality_rules`).
      Override direto apenas se o nome da tabela divergir desse padrão.
    default: ${var.dqx_catalog}.${var.dqx_schema}.dq_quality_rules

  dqx_studio_url:
    description: |
      REQUIRED. Public URL of the DQX Studio app embedded by Motor de Regras.
      DQX Studio must already be deployed in the target workspace.
      Valor NÃO pode ser string vazia (API de Databricks Apps rejeita env vars
      sem valor — ver CLAUDE.md "Bundle gotchas").

  dqx_studio_sp:
    description: |
      Service principal da DQX Studio (o run_as dos jobs de validação). O task
      grant_warehouse_perms concede a esse SP leitura em rc18_catalog — necessário
      para os checks DQX com subquery (domínio/referência/batimento + o filter de
      escopo mensal dt_base=(SELECT max…)) resolverem.
    default: ""

  disabled_modules:
    description: |
      Lista CSV de módulos (menus da sidebar esquerda) a OCULTAR neste ambiente.
      Opções válidas: dashboard, quality, validations, rules, linking, governance,
      lineage, xml, genie, dash_conformidade, dash_criticas, reference.
      Ex.: "lineage" oculta só o Lineage; "lineage,genie,xml" oculta os três.
      Uma seção cuja totalidade de itens for ocultada some junto.
      Default oculta lineage + xml; use `__none__` para não desabilitar nada.
    default: "xml"
