# Bundle do ACELERADOR RC18 (rc18-starter-kit).
#
# Self-contained: provisiona catálogo + warehouse + schemas + volumes + pipelines
# DLT (bronze/silver/gold) + dashboards + setup job + app. O setup job semeia o
# schema reference E carrega os XMLs de exemplo em sample/ para o landing volume,
# permitindo rodar fim-a-fim com `databricks bundle deploy` apenas.
#
# Customers que já possuem catálogo/warehouse configuram `catalog` e
# `warehouse_id` no target.yml; nesse caso comentar
# resources/{catalog,warehouse}.yml para o bundle não gerenciar assets externos.
#
# Para o bundle de demo (mock app + geradores sintéticos), ver demo/databricks.yml.

bundle:
  name: rc18-starter-kit

include:
  # Single default target. Copy target.yml.example to the git-ignored target.yml.
  - target.yml
  - resources/*.yml
  - resources/**/*.yml

sync:
  # Inclui apenas o que o bundle precisa (evita subir docs/, demo/, .venv/, etc.)
  paths:
    - app
    - notebooks
    - pipelines
    - dashboards
    - resources
    - sample
  exclude:
    - "**/node_modules/"
    - "**/__pycache__/"
    - "**/*.pyc"
    - "**/.DS_Store"

variables:
  catalog:
    default: "rc18_catalog"
    description: "Unity Catalog name. Omit in target.yml to provision and use rc18_catalog."

  warehouse_id:
    description: "SQL Warehouse ID. Omit in target.yml to provision and use the bundle-managed Serverless 2X-Small warehouse."
    default: ${resources.sql_warehouses.rc18_warehouse.id}

  genie_space_id:
    description: "Genie Space ID. Sentinela __unset__ = Genie desativado (placeholder no app). Setar no target.yml após criar o space via bundle genie/."
    default: "__unset__"

  app_name:
    default: "rc18-starter-kit"

  schema_bronze:
    default: "bronze"
  schema_silver:
    default: "silver"
  schema_gold:
    default: "gold"
  schema_quality:
    default: "quality"

  dqx_catalog:
    description: |
      Unity Catalog de VÍNCULO com a DQX Studio (env var `DQX_CATALOG` no app
      databrickslabs/dqx). É onde a Studio persiste as regras — o backend RC18
      lê de `${dqx_catalog}.${dqx_schema}.dq_quality_rules`. Ajuste no target.yml
      quando a Studio vive em outro catálogo que não o default.
    default: "dqx"

  dqx_schema:
    description: |
      Schema da DQX Studio dentro de `${var.dqx_catalog}` (env var `DQX_SCHEMA`
      no app databrickslabs/dqx). Junto com o catálogo forma o FQN da tabela de
      regras.
    default: "dqx_studio"

  dqx_checks_table:
    description: |
      FQN completo da tabela onde a DQX Studio armazena as regras. Composto por
      padrão a partir de `dqx_catalog` + `dqx_schema` (tabela `dq_quality_rules`).
      Override direto apenas se o nome da tabela divergir desse padrão.
    default: ${var.dqx_catalog}.${var.dqx_schema}.dq_quality_rules

  dqx_studio_url:
    description: |
      REQUIRED. Public URL of the DQX Studio app embedded by Motor de Regras.
      DQX Studio must already be deployed in the target workspace.
      Valor NÃO pode ser string vazia (API de Databricks Apps rejeita env vars
      sem valor — ver CLAUDE.md "Bundle gotchas").
