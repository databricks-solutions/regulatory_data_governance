# Bundle do DEMO — para experimentar o acelerador fim-a-fim com dados sintéticos.
#
# Inclui todo o acelerador (app + pipelines + dashboards + genie) MAIS
# os geradores sintéticos de Doc 3040/3050 e o loader de dados fictícios.
#
# Para implantar apenas o acelerador (sem dados sintéticos), rodar
# `databricks bundle deploy` a partir da raiz do repositório (bundle rc18-starter-kit).

bundle:
  name: rc18-demo

include:
  # Recursos do acelerador (reutilizados do bundle do core)
  - ../resources/*.yml
  - ../resources/**/*.yml
  # Recursos exclusivos do demo (geradores + loaders sintéticos)
  - resources/*.yml

sync:
  # Inclui apenas o que o bundle precisa (evita subir docs/, .venv/, etc.)
  paths:
    - ../app
    - ../notebooks
    - ../pipelines
    - ../dashboards
    - ../resources
    - notebooks
    - resources
    - prompts


variables:
  catalog:
    default: "rc18_demo_catalog"
    description: "Unity Catalog name (override per-target or via DATABRICKS_BUNDLE_VAR_catalog)"

  warehouse_id:
    description: "SQL Warehouse ID — defaults to the demo-provisioned 2X-Small serverless warehouse. Override with --var warehouse_id=<id> or BUNDLE_VAR_warehouse_id to reuse an existing warehouse."
    default: ${resources.sql_warehouses.rc18_demo_warehouse.id}

  app_name:
    default: "rc18-demo"

  cloud:
    description: "Target cloud: azure | aws | gcp. Set automatically by the target you pick (-t azure / -t aws / -t gcp)."
    default: "azure"

  validator_node_type:
    description: "Cluster node type for the BACEN TXB validator (classic single-node, JVM required). Set automatically per target based on `cloud`."
    default: "Standard_DS3_v2"

  schema_bronze:
    default: "bronze"
  schema_silver:
    default: "silver"
  schema_gold:
    default: "gold"
  schema_quality:
    default: "quality"

targets:
  # Cross product of env (dev | prod) × cloud (azure | aws | gcp) = 6 targets.
  # Pick with `databricks bundle deploy -t <env>-<cloud>`. dev-azure is the default.
  #
  # dev-* → mode: development (per-user root path, [dev <user>] prefixing).
  # prod-* → mode: production (shared workspace path, no prefixing).
  # Each target picks the smallest Databricks-supported node on its cloud for
  # the BACEN TXB validator (classic single-node, JVM required).

  dev-azure:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: azure
      validator_node_type: Standard_DS3_v2

  dev-aws:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: aws
      validator_node_type: m5d.large

  dev-gcp:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: gcp
      validator_node_type: n2-highmem-4

  prod-azure:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: azure
      validator_node_type: Standard_DS3_v2

  prod-aws:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: aws
      validator_node_type: m5d.large

  prod-gcp:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: gcp
      validator_node_type: n2-highmem-4
