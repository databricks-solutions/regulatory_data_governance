# Bundle do DEMO RC18.
#
# Escopo enxuto: serve para mostrar o app em modo mock + os geradores sintéticos
# de Doc 3040/3050 e o loader de dados fictícios. NÃO inclui as pipelines do
# acelerador (bronze/silver/gold), nem os dashboards Lakeview, nem o setup de
# referência — esses só fazem sentido na implantação real (bundle do core, raiz
# do repo: rc18-starter-kit).
#
# Recursos provisionados pelo demo:
#   - apps.r18_compliance_app             (mock=true, source compartilhado em ../app/backend)
#   - catalogs.rc18_demo_catalog          (catálogo dedicado ao demo)
#   - schemas.bronze, schemas.reference   (homes para tabelas geradas pelos jobs)
#   - jobs.synthetic_data_loader          → r18-synthetic-data-loader
#   - jobs.scr3040_generator              → rc18-scr3040-generator
#   - jobs.scr3050_generator              → rc18-scr3050-generator
#
# Para implantar o acelerador completo (com pipelines DLT e dashboards), rodar
# `databricks bundle deploy` a partir da raiz (bundle rc18-starter-kit).

bundle:
  name: rc18-demo

include:
  - resources/*.yml

sync:
  paths:
    # Source code do app (shared com o bundle do core)
    - ../app
    # Notebooks dos geradores + loader sintético + assets do validador BACEN
    - notebooks
    - assets
    - resources
    - prompts
  exclude:
    - "**/node_modules/"
    - "**/__pycache__/"
    - "**/*.pyc"
    - "**/.DS_Store"

variables:
  catalog:
    default: "rc18_demo_catalog"
    description: "Unity Catalog name (override per-target or via DATABRICKS_BUNDLE_VAR_catalog)"

  app_name:
    default: "rc18-demo"

  cloud:
    description: "Target cloud: azure | aws | gcp. Set automatically by the target you pick (-t <env>-<cloud>)."
    default: "azure"

  validator_node_type:
    description: "Cluster node type for the BACEN TXB validator (classic single-node, JVM required). Set automatically per target based on `cloud`."
    default: "Standard_DS3_v2"

targets:
  # Cross product of env (dev | prod) × cloud (azure | aws | gcp) = 6 targets.
  # Pick with `databricks bundle deploy -t <env>-<cloud>`. dev-azure is the default.
  #
  # dev-* → mode: development (per-user root path, [dev <user>] prefixing).
  # prod-* → mode: production (shared workspace path, no prefixing).
  # Each target picks the smallest Databricks-supported node on its cloud for
  # the BACEN TXB validator (classic single-node, JVM required).

  dev-azure:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: azure
      validator_node_type: Standard_DS3_v2

  dev-aws:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: aws
      validator_node_type: m5d.large

  dev-gcp:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      cloud: gcp
      validator_node_type: n2-highmem-4

  prod-azure:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: azure
      validator_node_type: Standard_DS3_v2

  prod-aws:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: aws
      validator_node_type: m5d.large

  prod-gcp:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      cloud: gcp
      validator_node_type: n2-highmem-4
