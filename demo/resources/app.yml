# Databricks App for the RC18 demo bundle.
# Mock-mode showcase: backend serves fixtures, no warehouse/UC reads.
# Source code is shared with the implementation bundle (../../app/backend).
#
# `lifecycle.started: true` makes `databricks bundle deploy` also push the
# code into the running container — without it the app resource is created
# but stays in "Unavailable" until you run a separate `bundle run`.
resources:
  apps:
    r18_compliance_app:
      name: ${var.app_name}-${bundle.target}
      description: "RC18 Demo — mock-mode showcase of the BACEN R.18 compliance accelerator"
      source_code_path: ../../app/backend
      lifecycle:
        started: true

      config:
        env:
          - name: USE_MOCK_BACKEND
            value: "true"
          # --- Live DQX Studio (optional, for the demo's rule-authoring story) ---
          # The "Motor de Regras" (/rules) page embeds DQX Studio via iframe when
          # this is set; otherwise it shows a deploy empty-state. To author rules
          # live during the demo, deploy DQX Studio and UNCOMMENT the two lines
          # below with its public app URL. Do NOT leave the value empty — the
          # Apps API rejects env entries with an empty `value`. Do NOT commit a
          # real workspace URL/ID — supply it at deploy time.
          # - name: DQX_STUDIO_URL
          #   value: "https://<your-dqx-studio-app>.databricksapps.com"
          # --- Live Lakeview dashboards (PT-BR variants) ---
          # The dashboard embed path does NOT depend on USE_MOCK_BACKEND — it
          # always builds the iframe URL from the live workspace config. To wire
          # the dashboard tabs to real dashboards deployed by the core bundle
          # (rc18-starter-kit), UNCOMMENT and supply the IDs at deploy time
          # (e.g. via --var / deploy env). Do NOT commit real resource IDs.
          # - name: DASHBOARD_ID_CONFORMIDADE
          #   value: "<conformidade-dashboard-id>"
          # - name: DASHBOARD_ID_CRITICAS
          #   value: "<criticas-dashboard-id>"
          # --- Genie space embedded on the "Genie Agent" (/genie) page. Embed
          # path is independent of USE_MOCK_BACKEND. Supply at deploy time; do
          # NOT commit a real space ID. ---
          # - name: GENIE_SPACE_ID
          #   value: "<genie-space-id>"

      permissions:
        - level: CAN_USE
          group_name: "users"
