# SCR Doc 3050 synthetic XML generator — 5-step sequential job
# Consome as tabelas f_3040_* produzidas pelo job `scr3040_generator` e
# agrega-as conforme a Equivalência BACEN (3040 ↔ 3050).
#
# Tasks 00-03 rodam serverless (compartilham contexto via %run ./00_Setup_e_Equivalencia)
# Task 04 valida o XML com o ValidadorMDR do BACEN (Java) — exige JVM no driver,
# portanto cluster clássico single-node SINGLE_USER (necessário para ler UC Volumes).
resources:
  jobs:
    scr3050_generator:
      name: "rc18-scr3050-generator"
      description: "Gera amostra sintética do Doc 3050 (TXB V11) a partir do 3040 e valida com o ValidadorMDR do BCB."
      max_concurrent_runs: 1

      parameters:
        - name: dt_base
          default: "2026-03"
        - name: cnpj_if
          default: "99999999"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          # Use the bundle-managed reference schema so dev-mode prefixing
          # (`dev_<user>_reference`) is picked up automatically.
          default: ${resources.schemas.reference.name}
        - name: volume_out
          default: "/Volumes/${var.catalog}/${resources.schemas.reference.name}/scr3050_out"
        - name: src_prefix_3040
          # Keep aligned with the 3040 generator's output schema.
          default: "${var.catalog}.${resources.schemas.reference.name}.f_3040_"
        - name: leiaute_versao
          default: "V11"
        - name: validador_zip
          # ZIP versionado em demo/assets/validators/SCR3050_Validador.bin
          # Extensão .bin evita auto-extract pelo Workspace Files API.
          default: "${workspace.file_path}/demo/assets/validators/SCR3050_Validador.bin"
        - name: validador_main_class
          default: "br.gov.bcb.mdr.validador.entrada.linhacomando.ValidadorLinhaComando"
        - name: xsd_path
          # XSD versionado em demo/assets/validators/Schema_TXB_V11.xsd
          default: "${workspace.file_path}/demo/assets/validators/Schema_TXB_V11.xsd"
        - name: fail_on_error
          default: "true"

      # Ambiente serverless compartilhado pelos notebooks 00-03.
      # lxml é importado pelo notebook 03 — sem isso falha com ModuleNotFoundError.
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - lxml

      # Cluster clássico exclusivo para a task 04 (Java/ValidadorMDR).
      # SINGLE_USER é necessário para acessar UC Volumes via FUSE no driver.
      job_clusters:
        - job_cluster_key: validator_classic
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: ${var.validator_node_type}
            num_workers: 0
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
              Purpose: "scr3050-validator"

      tasks:
        - task_key: setup_e_equivalencia
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../notebooks/scr3050_generator/00_Setup_e_Equivalencia.py
            base_parameters:
              dt_base: "{{job.parameters.dt_base}}"
              cnpj_if: "{{job.parameters.cnpj_if}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_out: "{{job.parameters.volume_out}}"
              src_prefix_3040: "{{job.parameters.src_prefix_3040}}"
              leiaute_versao: "{{job.parameters.leiaute_versao}}"

        - task_key: ingestao_dados_3040
          depends_on:
            - task_key: setup_e_equivalencia
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../notebooks/scr3050_generator/01_Ingestao_Dados_3040.py
            base_parameters:
              dt_base: "{{job.parameters.dt_base}}"
              cnpj_if: "{{job.parameters.cnpj_if}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              src_prefix_3040: "{{job.parameters.src_prefix_3040}}"

        - task_key: motor_de_agregacao_3050
          depends_on:
            - task_key: ingestao_dados_3040
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../notebooks/scr3050_generator/02_Motor_de_Agregacao_3050.py
            base_parameters:
              dt_base: "{{job.parameters.dt_base}}"
              cnpj_if: "{{job.parameters.cnpj_if}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              leiaute_versao: "{{job.parameters.leiaute_versao}}"

        - task_key: geracao_e_exportacao_xml
          depends_on:
            - task_key: motor_de_agregacao_3050
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../notebooks/scr3050_generator/03_Geracao_e_Exportacao_XML.py
            base_parameters:
              dt_base: "{{job.parameters.dt_base}}"
              cnpj_if: "{{job.parameters.cnpj_if}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_out: "{{job.parameters.volume_out}}"
              leiaute_versao: "{{job.parameters.leiaute_versao}}"

        # Task 04 precisa de JVM no driver → cluster clássico single-node.
        - task_key: validacao_bacen_automatizada
          depends_on:
            - task_key: geracao_e_exportacao_xml
          job_cluster_key: validator_classic
          notebook_task:
            notebook_path: ../notebooks/scr3050_generator/04_Validacao_BACEN_Automatizada.py
            base_parameters:
              dt_base: "{{job.parameters.dt_base}}"
              cnpj_if: "{{job.parameters.cnpj_if}}"
              volume_out: "{{job.parameters.volume_out}}"
              validador_zip: "{{job.parameters.validador_zip}}"
              validador_main_class: "{{job.parameters.validador_main_class}}"
              xsd_path: "{{job.parameters.xsd_path}}"
              fail_on_error: "{{job.parameters.fail_on_error}}"
