# Serverless SQL warehouse provisioned for the demo bundle.
# Drives dashboards, Genie room, and SQL execution on synthetic data.
# Customer (core) bundle does NOT create a warehouse — customers point to their own
# via the `warehouse_id` variable.

resources:
  sql_warehouses:
    rc18_demo_warehouse:
      name: rc18-demo-warehouse
      cluster_size: "2X-Small"
      warehouse_type: PRO
      enable_serverless_compute: true
      auto_stop_mins: 10
      min_num_clusters: 1
      max_num_clusters: 1
