  genie_spaces:
    rc18_genie:
      title: Genie Agent — SCR R.18
      description: Consultas em linguagem natural sobre dados de risco de crédito reportados ao Banco Central (SCR Doc 3040 e Doc 3050) e sobre a qualidade dos dados segundo a Resolução Conjunta nº 18. Explore posições de crédito, equivalência de modalidades 3040↔3050, as 12 dimensões de qualidade R.18 e incidentes de governança — tudo em Português-BR com a terminologia oficial BCB/SCR.
