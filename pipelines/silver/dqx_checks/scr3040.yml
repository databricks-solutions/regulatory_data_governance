# 4 regras iniciais do acelerador RC18 — fonte canonica para o seed de
# dq_quality_rules (DQX Studio). Novas regras devem ser criadas via DQX Studio.
#
# Convencao de tags (user_metadata):
#   projeto       — sempre 'RC.18'
#   descricao     — texto curto da regra (1 linha)
#   dimensao_r18  — dimensao R.18 em algarismo romano (I..XII). Authoritative;
#                   o backend usa esta tag para agrupar regras no modulo
#                   "Qualidade R.18". Se ausente, faz fallback no
#                   `app/backend/rc18_rule_meta.py`.
#
# Demais metadados estruturais (critica_id, nivel_verificacao) seguem hard-
# coded em `rc18_rule_meta.py` — mantemos as tags do Studio enxutas.

- name: autorzc_in_dominio
  criticality: error
  run_config_name: silver_3040_clientes
  check:
    function: sql_expression
    arguments:
      expression: "autorzc IN ('S', 'N')"
      msg: "Autorzc deve ser 'S' ou 'N'."
  user_metadata:
    projeto: "RC.18"
    descricao: "Autorzc deve conter apenas 'S' ou 'N'."
    dimensao_r18: "III"

- name: porte_cli_in_dominio_por_tipo
  criticality: error
  run_config_name: silver_3040_clientes
  check:
    function: sql_expression
    arguments:
      expression: |
        CASE
          WHEN is_pf THEN porte_cli IN ('0','1','2','3','4','5','6','7','8')
          WHEN is_pj THEN porte_cli IN ('0','1','2','3','4')
          ELSE FALSE
        END
      msg: "PorteCli fora do dominio (PF: 0-8; PJ: 0-4)."
  user_metadata:
    projeto: "RC.18"
    descricao: "PorteCli deve ser 0-4 para PJ e 0-8 para PF."
    dimensao_r18: "III"

- name: tp_ctrl_in_dominio
  criticality: error
  run_config_name: silver_3040_clientes
  check:
    function: sql_expression
    arguments:
      expression: "tp_ctrl IN ('01', '02', '03', '04')"
      msg: "TpCtrl fora do dominio {'01','02','03','04'}."
  user_metadata:
    projeto: "RC.18"
    descricao: "TpCtrl deve conter apenas '01', '02', '03' ou '04'."
    dimensao_r18: "III"

- name: dia_atraso_nao_negativo
  criticality: error
  run_config_name: silver_3040_operacoes
  check:
    function: sql_expression
    arguments:
      expression: "dia_atraso >= 0"
      msg: "DiaAtraso deve ser inteiro nao negativo (>= 0)."
  user_metadata:
    projeto: "RC.18"
    descricao: "DiaAtraso deve conter apenas valores inteiros nao negativos."
    dimensao_r18: "II"
