# ─────────────────────────────────────────────────────────────────────────────
# Regras de QUALIDADE DQX — TABELA-ALVO: gold.reconciliacao_cosif
#
# BATIMENTO INTER-CADOC (SCR 3040 × COSIF Documento 4010).
# Dimensão R.18: 8 (Consistência) — "informações livres de contradições, mesmo
# de fontes diferentes". Aqui as fontes são dois CADOCs: SCR 3040 (individual)
# × Balancete COSIF Documento 4010 (contábil). Ancorado na crítica de rejeição
# oficial N01 ("Rejeição na validação interna e batimento Cosif").
#
# COMO FUNCIONA: estes checks NÃO rodam sobre a silver do 3040, e sim sobre a
# tabela de reconciliação já materializada (uma linha por rubrica COSIF/regra),
# onde `vlr_scr` (agregado do 3040) e `vlr_cosif` (saldo do Doc 4010) já foram
# calculados. O simulador do CADOC 4010 (demo/notebooks/doc4010_generator/)
# produz essa tabela. A regra apenas verifica se a diferença está na tolerância.
#
# Colunas esperadas: tipo_regra, codigo_regra, cosif_conta, vlr_scr, vlr_cosif,
#   vlr_diferenca, pct_diferenca, tolerancia_pct, status
#   (ver docs/spec/03_data_model.md §4.3).
#
# ⚠️ ESCOPO / SIMULAÇÃO: o mapeamento rubrica-COSIF ↔ filtros de
#    natureza/modalidade/vencimento do 3040 é REPRESENTATIVO e simplificado
#    (subconjunto de regras T/M), não a lógica COSIF completa do BACEN. Serve
#    para demonstrar a dimensão Consistência ponta a ponta.
#
# ⚠️ Substitua `rc18_catalog` pelo seu catálogo antes de aplicar (BYOC).
# ─────────────────────────────────────────────────────────────────────────────

# N01 (genérica) — a diferença entre o valor SCR e o valor COSIF de cada rubrica
# deve estar dentro da tolerância configurada na própria linha (tolerancia_pct).
# Uma violação = divergência de batimento (a rejeição de negócio N01 do BACEN).
- name: batimento_cosif_dentro_tolerancia
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "vlr_cosif IS NULL OR vlr_cosif = 0 OR abs(pct_diferenca) <= tolerancia_pct"
      msg: "Divergência de batimento SCR 3040 × COSIF (Doc 4010) acima da tolerância (N01)."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "N01"
    descricao: "O valor agregado do SCR 3040 deve bater com o saldo COSIF do Doc 4010 dentro da tolerância."
    nivel_verificacao: "2"

# Reforço: status materializado pela reconciliação não pode ser BLOQUEADO.
# (redundante com a regra acima, mas explicita o gate de negócio no scorecard).
- name: batimento_cosif_status_nao_bloqueado
  criticality: error
  check:
    function: sql_expression
    arguments:
      # SEM literal string (o DQX corrompe aspas no parse_json inline): o status
      # bloqueante vem da view reference.v_recon_status_bloqueante. Passa quando o
      # status NÃO está na lista de bloqueantes (ou é nulo).
      expression: "status IS NULL OR status NOT IN (SELECT valor_codigo FROM rc18_catalog.reference.v_recon_status_bloqueante)"
      msg: "Batimento COSIF com status BLOQUEADO — divergência impede a remessa."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "N01-STATUS"
    descricao: "Nenhuma regra de batimento COSIF pode estar em status BLOQUEADO."
    nivel_verificacao: "2"
