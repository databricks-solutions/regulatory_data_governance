# ─────────────────────────────────────────────────────────────────────────────
# Regras de QUALIDADE DQX — SCR 3040 · CONSISTÊNCIA INTRA-DOCUMENTO
#
# Verificam coerência DENTRO do próprio 3040 (entre campos e entre blocos),
# sem depender de fonte externa. Rodam CEDO sobre a silver.
#
# Dimensões R.18: 8 (Consistência) e 6 (Completude), conforme cada regra.
# Códigos ancorados no catálogo oficial docs/scr3040/SCR3040_Criticas.xls
# (abas Semântica/Individualizadas/Agregadas). Só regras VIGENTES (as marcadas
# "Vigente até 12/2024", p.ex. ligadas a ClassOp/Anexo 17, foram excluídas —
# descontinuadas desde jan/2025, Res. CMN 4.966).
#
# ⚠️ Substitua `rc18_catalog` pelo seu catálogo antes de aplicar (BYOC).
#
# Alvo por check (run_config_name / tabela no DQX Studio) indicado em cada bloco.
# ─────────────────────────────────────────────────────────────────────────────

# ── scr3040_operacoes ────────────────────────────────────────────────────────

# S10/S45 — dia de atraso não pode ser negativo (valor inválido).
- name: dia_atraso_nao_negativo
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "dia_atraso IS NULL OR dia_atraso >= 0"
      msg: "DiaAtraso negativo — valor inválido (esperado inteiro não-negativo)."
  user_metadata:
    dimensao_r18: "2"
    critica_id: "S10_004"
    descricao: "Dias de atraso da operação não podem ser negativos."
    nivel_verificacao: "1"

# S14 — compatibilidade entre data de contratação e data de vencimento.
- name: dt_contr_le_dt_venc_op
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "dt_contr IS NULL OR dt_venc_op IS NULL OR dt_contr <= dt_venc_op"
      msg: "Data de contratação posterior à data de vencimento da operação."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "S14"
    descricao: "A data de contratação deve ser anterior ou igual à data de vencimento."
    nivel_verificacao: "2"

# S15/S70 — data de contratação não pode ser posterior à data-base.
- name: dt_contr_le_dt_base
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "dt_contr IS NULL OR dt_contr <= dt_base"
      msg: "Data de contratação posterior à data-base da remessa."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "S15"
    descricao: "A data de contratação não pode ser posterior à data-base."
    nivel_verificacao: "2"

# S87/S88 — IPOC bem-formado e consistente com os campos que o compõem
# (a silver já deriva `ipoc_is_consistent` a partir da decomposição do IPOC).
- name: ipoc_consistente
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "ipoc IS NOT NULL AND length(ipoc) = 30 AND ipoc_is_consistent"
      msg: "IPOC ausente, com tamanho != 30 ou inconsistente com CNPJ/Mod/TpCli/Cli/Contrato."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "S87"
    descricao: "IPOC deve ter 30 caracteres e ser consistente com os campos que o compõem."
    nivel_verificacao: "2"

# ── scr3040_operacoes × scr3040_clientes (integridade referencial) ───────────

# Integridade referencial: toda operação referencia um cliente existente no
# bloco de clientes (mesmo cnpj_if/dt_base/cli_cd).
- name: operacao_referencia_cliente_existente
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: >
        cli_cd IS NULL OR EXISTS (
          SELECT 1 FROM rc18_catalog.silver.scr3040_clientes c
          WHERE c.cnpj_if = cnpj_if AND c.dt_base = dt_base AND c.cli_cd = cli_cd
        )
      msg: "Operação referencia cliente inexistente no bloco de clientes."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "REF-OP-CLI"
    descricao: "Toda operação deve referenciar um cliente presente no documento (integridade referencial)."
    nivel_verificacao: "2"

# ── scr3040_vencimentos ──────────────────────────────────────────────────────

# A04 — cada operação/agregação deve conter pelo menos um vencimento (> 0).
- name: possui_ao_menos_um_vencimento
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "vertice_count >= 1 AND total_saldo > 0"
      msg: "Operação/agregação sem nenhum vencimento informado (não admitida)."
  user_metadata:
    dimensao_r18: "6"
    critica_id: "A04"
    descricao: "Cada agregação/operação deve conter pelo menos um vencimento com saldo positivo."
    nivel_verificacao: "2"

# ── scr3040_garantias ────────────────────────────────────────────────────────

# S13 — garantidor fidejussório não pode ser o próprio cliente principal
# (o identificador da garantia difere do código do cliente).
- name: garantidor_fidejussorio_nao_e_cliente
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: "NOT is_fidejussoria OR ident IS NULL OR ident <> cli_cd"
      msg: "Garantidor fidejussório coincide com o cliente principal da operação."
  user_metadata:
    dimensao_r18: "8"
    critica_id: "S13"
    descricao: "O garantidor fidejussório não pode ser o próprio cliente principal."
    nivel_verificacao: "2"
