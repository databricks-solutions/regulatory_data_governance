# ─────────────────────────────────────────────────────────────────────────────
# Regras de QUALIDADE DQX — SCR 3040 · DOMÍNIO (valores válidos por campo)
#
# Aplicar via DQX Studio (databrickslabs/dqx) sobre a tabela silver do 3040.
# Dimensão R.18 predominante: 9 (Integridade) — "informação autêntica"; o valor
# do campo pertence ao domínio oficial vigente do leiaute 3040.
#
# Fonte dos códigos: catálogo oficial docs/scr3040/SCR3040_Criticas.xls (abas
# Semântica/Campos Obrigatórios). NÃO reproduzem o Validador BACEN — rodam CEDO
# (shift-left) sobre a silver para alimentar o scorecard R.18.
#
# ⚠️ Placeholders: substitua `rc18_catalog` pelo seu catálogo (BYOC) antes de
#    aplicar. Os checks de EXISTS consultam `rc18_catalog.reference.dominios`
#    (semeada por notebooks/setup/setup_reference_tables.py).
#
# Alvo (run_config_name / tabela no DQX Studio):
#   - natu_op/mod        → rc18_catalog.silver.scr3040_operacoes
#   - cli_tp/autorzc/porte_cli/tp_ctrl → rc18_catalog.silver.scr3040_clientes
# ─────────────────────────────────────────────────────────────────────────────

# ── Domínios data-driven (EXISTS em reference.dominios) ──────────────────────
# Campos semeados na dominios: TpCli, NatuOp, Mod (documento='3040').

- name: natu_op_in_dominio
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: >
        natu_op IS NULL OR EXISTS (
          SELECT 1 FROM rc18_catalog.reference.dominios d
          WHERE d.documento = '3040' AND d.campo = 'NatuOp'
            AND d.valor_codigo = natu_op AND d.is_current
        )
      msg: "NatuOp fora do domínio vigente do leiaute 3040."
  user_metadata:
    dimensao_r18: "9"
    critica_id: "S-DOM-NatuOp"
    descricao: "Natureza da operação deve pertencer ao domínio oficial vigente (reference.dominios)."
    nivel_verificacao: "1"

- name: mod_in_dominio
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: >
        mod IS NULL OR EXISTS (
          SELECT 1 FROM rc18_catalog.reference.dominios d
          WHERE d.documento = '3040' AND d.campo = 'Mod'
            AND d.valor_codigo = mod AND d.is_current
        )
      msg: "Modalidade (Mod) fora do domínio vigente do leiaute 3040."
  user_metadata:
    dimensao_r18: "9"
    critica_id: "S-DOM-Mod"
    descricao: "Modalidade da operação deve pertencer ao domínio oficial vigente (reference.dominios)."
    nivel_verificacao: "1"

- name: cli_tp_in_dominio
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: >
        cli_tp IS NULL OR EXISTS (
          SELECT 1 FROM rc18_catalog.reference.dominios d
          WHERE d.documento = '3040' AND d.campo = 'TpCli'
            AND d.valor_codigo = cli_tp AND d.is_current
        )
      msg: "Tipo de cliente (TpCli) fora do domínio vigente do leiaute 3040."
  user_metadata:
    dimensao_r18: "9"
    critica_id: "S17-DOM-TpCli"
    descricao: "Tipo de cliente deve pertencer ao domínio oficial vigente (reference.dominios)."
    nivel_verificacao: "1"

# ── Domínios fechados pequenos (IN inline) ───────────────────────────────────
# reference.dominios NÃO semeia Autorzc/PorteCli/TpCtrl; usamos lista inline.
# Nomes IDÊNTICOS às 4 regras-semente do acelerador (rc18_rule_meta.py) para
# não divergir do mapeamento crítica→dimensão já existente.

- name: autorzc_in_dominio
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "autorzc IS NULL OR autorzc IN ('S','N')"
      msg: "Autorzc fora do domínio {S,N} do leiaute SCR 3040."
  user_metadata:
    dimensao_r18: "3"
    critica_id: "S20_001"
    descricao: "Indicador de autorização de consulta deve ser 'S' ou 'N'."
    nivel_verificacao: "1"

- name: tp_ctrl_in_dominio
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: "tp_ctrl IS NULL OR tp_ctrl IN ('01','02','03','04')"
      msg: "TpCtrl fora do domínio oficial {'01','02','03','04'} do leiaute SCR 3040."
  user_metadata:
    dimensao_r18: "3"
    critica_id: "S20_003"
    descricao: "Tipo de controle societário deve pertencer ao domínio oficial."
    nivel_verificacao: "1"

- name: porte_cli_in_dominio_por_tipo
  criticality: error
  check:
    function: sql_expression
    arguments:
      # Porte condicional ao tipo de pessoa: PF (is_pf) 0-8; PJ (is_pj) 0-4.
      expression: >
        porte_cli IS NULL
        OR (is_pf AND porte_cli IN ('0','1','2','3','4','5','6','7','8'))
        OR (is_pj AND porte_cli IN ('0','1','2','3','4'))
      msg: "PorteCli fora do domínio condicional ao tipo (PF: 0-8; PJ: 0-4)."
  user_metadata:
    dimensao_r18: "3"
    critica_id: "S20_002"
    descricao: "Porte do cliente deve respeitar o domínio condicional ao tipo de pessoa."
    nivel_verificacao: "1"
