# ─────────────────────────────────────────────────────────────────────────────
# Regras de QUALIDADE DQX — TABELA-ALVO: silver.scr3040_vencimentos
#
# Checks de CONSISTÊNCIA intra-documento da entidade Vencimentos do 3040.
# Dimensão R.18: 11 (Relevância). Cada bloco mantém seu critica_id oficial.
#
# Fonte dos códigos: catálogo oficial docs/scr3040/SCR3040_Criticas.xls. NÃO
# reproduzem o Validador BACEN — rodam CEDO (shift-left) sobre a silver.
#
# ⚠️ Substitua `rc18_catalog` pelo seu catálogo antes de aplicar (BYOC).
#
# ⏱️ EXECUÇÃO MENSAL: o check tem `filter` = só a data-base corrente
#    (`dt_base = (SELECT max(dt_base) FROM esta_tabela)`). Execute com "All rows"
#    (sample_size=0): o DQX amostra ANTES do filter. Ver quality/README.md.
# ─────────────────────────────────────────────────────────────────────────────

# A04 — cada operação/agregação deve conter pelo menos um vencimento (> 0).
- name: possui_ao_menos_um_vencimento
  criticality: error
  # Escopo mensal: só a data-base corrente (MAX(dt_base) desta tabela).
  filter: "dt_base = (SELECT max(dt_base) FROM rc18_catalog.silver.scr3040_vencimentos)"
  check:
    function: sql_expression
    arguments:
      expression: "vertice_count >= 1 AND total_saldo > 0"
      msg: "Operação/agregação sem nenhum vencimento informado (não admitida)."
  user_metadata:
    dimensao_r18: "11"  # Relevância: agregação sem vértice com saldo é número sem uso decisório.
    critica_id: "A04"
    descricao: "Cada agregação/operação deve conter pelo menos um vencimento com saldo positivo."
    nivel_verificacao: "2"
