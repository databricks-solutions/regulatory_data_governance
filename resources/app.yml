# Databricks App for the RC18 accelerator (implementation/customer bundle).
# Runs against real Unity Catalog data — USE_MOCK_BACKEND is false.
# Customers point the warehouse and dashboard IDs at their own assets via bundle vars.
#
# `lifecycle.started: true` makes `databricks bundle deploy` also push the
# code into the running container and start the app — without it, the app
# resource gets created but stays in "Unavailable" until you run a separate
# `databricks bundle run r18_compliance_app`. Only supported in direct
# deployment mode (DATABRICKS_BUNDLE_ENGINE=direct), which the bundle already
# requires because of the `catalogs:` resource.
resources:
  apps:
    r18_compliance_app:
      name: ${var.app_name}-${bundle.target}
      description: "RC18 StarterKit — BACEN Resolucao Conjunta N.18 Compliance Accelerator"
      source_code_path: ../app/backend
      lifecycle:
        started: true

      config:
        env:
          - name: USE_MOCK_BACKEND
            value: "false"
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          # Schema names sourced from the schema RESOURCES (not raw vars) so
          # the app's env stays in sync with whatever the bundle deployed —
          # currently literal `bronze`/`silver`/`gold`/`quality`/`reference`
          # since `mode: development` is not used. If a customer brings their
          # own catalog (commenting out resources/uc_assets.yml), replace
          # these resource refs with ${var.schema_*} and set SCHEMA_REFERENCE
          # to point at their existing reference schema.
          - name: SCHEMA_BRONZE
            value: ${resources.schemas.bronze_schema.name}
          - name: SCHEMA_SILVER
            value: ${resources.schemas.silver_schema.name}
          - name: SCHEMA_GOLD
            value: ${resources.schemas.gold_schema.name}
          - name: SCHEMA_QUALITY
            value: ${var.schema_quality}
          - name: SCHEMA_REFERENCE
            value: ${resources.schemas.reference.name}
          # Catálogo/schema DELTA da Studio: FQN das tabelas de EXECUÇÃO
          # (dq_validation_runs + dq_metrics), lidas via warehouse.
          - name: DQX_CATALOG
            value: ${var.dqx_catalog}
          - name: DQX_SCHEMA
            value: ${var.dqx_schema}
          # Lakebase Postgres da Studio — onde `dq_quality_rules` vive desde a
          # DQX 0.15/0.16; popula Críticas SCR. Ver app/backend/dqx_lakebase.py e,
          # para o GRANT manual, notebooks/setup/grant_dqx_lakebase_access.sql.
          - name: DQX_LAKEBASE_ENDPOINT
            value: ${var.dqx_lakebase_endpoint}
          - name: DQX_LAKEBASE_DATABASE
            value: ${var.dqx_lakebase_database}
          - name: DQX_LAKEBASE_SCHEMA
            value: ${var.dqx_lakebase_schema}
          - name: DQX_RULES_TABLE
            value: ${var.dqx_rules_table}
          - name: DASHBOARD_ID_CONFORMIDADE
            value: ${resources.dashboards.conformidade_r18.id}
          - name: DASHBOARD_ID_CRITICAS
            value: ${resources.dashboards.monitor_criticas.id}
          # Genie Space (opt-in, provisionado pelo bundle separado `genie/`).
          # Default `__unset__` = Genie desativado → o app mostra o placeholder
          # "disponível após deploy" (o backend normaliza __unset__/"" em db.py;
          # NÃO pode ser string vazia aqui pois a Apps API rejeita env sem
          # `value` — ver CLAUDE.md). Para ativar: rode o bundle `genie/`, pegue
          # o space_id gerado, defina `genie_space_id` no target.yml e redeploy.
          - name: GENIE_SPACE_ID
            value: ${var.genie_space_id}

          # URL do DQX Studio app (embarcada via iframe na rota /rules). Setado
          # via `var.dqx_studio_url`. Obrigatório: DQX Studio deve existir no
          # workspace e a URL deve estar preenchida no target.yml local.
          - name: DQX_STUDIO_URL
            value: ${var.dqx_studio_url}
          # Tela em que o iframe entra. Separada da URL porque a Studio renomeia
          # rotas — compilar isso no frontend foi o que quebrou o embed.
          - name: DQX_STUDIO_ENTRY_PATH
            value: ${var.dqx_studio_entry_path}

          # Módulos (menus da sidebar) a ocultar neste ambiente — CSV de slugs
          # (ex. "lineage,genie"). Default `__none__` = nada oculto. NÃO pode
          # ser vazio (Apps API rejeita env sem valor). Ver var.disabled_modules.
          - name: DISABLED_MODULES
            value: ${var.disabled_modules}

      permissions:
        - level: CAN_USE
          group_name: "compliance-team"
        - level: CAN_USE
          group_name: "executives"
        - level: CAN_MANAGE
          group_name: "platform-engineers"
