# Gold CLÁSSICO (default) — job standalone para reprocessar só a camada gold.
#
# Mesmo resource key `gold` do pipeline DLT → `databricks bundle run gold`
# funciona nos dois modos. Uma task por artefato:
# `bundle run gold --only posicao_2011`.
#
# As 7 primeiras leem silver e rodam em paralelo. Só `processing_state` lê gold,
# e espera as 4 posições MENSAIS (o 4016 é semestral — ver o notebook).
resources:
  jobs:
    gold:
      name: "r18-gold-${bundle.target}"
      description: "Curadoria gold clássica (sem SDP/DLT) — uma task por artefato: posições 3040/3050/4010/4016/2011 + críticas DDR + batimento COSIF + processing_state."
      max_concurrent_runs: 1

      tasks:
        - task_key: "posicao_3040"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_3040.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "posicao_3050"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_3050.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "posicao_4010"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_4010.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "posicao_4016"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_4016.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "posicao_2011"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_2011.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        # Lê a silver do 2011 (não a posição) → paralelo a posicao_2011.
        - task_key: "criticas_ddr_2011"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/criticas_ddr_2011.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        # Batimento N01: precisa da silver do 3040 E do 4010.
        - task_key: "reconciliacao_cosif"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/reconciliacao_cosif.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}
              reference_schema: ${resources.schemas.reference.name}

        - task_key: "processing_state"
          depends_on:
            - task_key: "posicao_3040"
            - task_key: "posicao_3050"
            - task_key: "posicao_4010"
            - task_key: "posicao_2011"
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/processing_state.py
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${resources.schemas.gold_schema.name}
