# End-to-end orchestration job for the RC18 accelerator — CLASSICAL MODE (default).
#
# Equivalente clássico (job Databricks + notebooks PySpark, SEM SDP/DLT) do
# `rc18_end_to_end` declarativo em resources/pipelines/orchestration_job.yml.
# Só um dos dois é deployado por vez (controlado pelo bloco `include:` do
# databricks.yml). Ambos usam o MESMO resource key `rc18_end_to_end`, então
# `databricks bundle run rc18_end_to_end` funciona idêntico nos dois modos —
# muda apenas se as camadas rodam como pipelines DLT ou tasks de notebook.
#
# Encadeia os assets em ordem de dependência para que um único
# `databricks bundle run rc18_end_to_end` leve a stack de um deploy limpo às
# tabelas gold populadas:
#
#   setup_reference  ┬→ setup_reference_2011 ─┐
#                    │                        │
#                    ├─→ load_sample_xmls ──┬─┴→ bronze_3040 → silver_3040 → gold_3040 ─┐
#                    │                      ├→ bronze_3050 → silver_3050 → gold_3050 ───┤
#                    │                      ├→ bronze_4010 → silver_4010 → gold_4010 ───┼→ gold_processing_state
#                    │                      ├→ bronze_4016 → silver_4016 → gold_4016    │
#                    │                      └→ bronze_2011 → silver_2011 ┬→ gold_2011 ──┘
#                    │                                                   └→ gold_criticas_2011
#                    └─→ grant_warehouse_perms (paralelo)
#
#   gold_reconciliacao_cosif  ←  silver_3040 + silver_4010   (batimento N01)
#
# Uma trilha bronze→silver→gold POR CADOC: falha em um não bloqueia os outros, e
# `--only <task>` reprocessa um documento isolado ponta a ponta. Só os dois
# artefatos cross-CADOC têm fan-in — `gold_reconciliacao_cosif` (3040 × 4010) e
# `gold_processing_state` (4 posições MENSAIS; o 4016 é semestral e fica fora).
#
# bronze/silver/gold aqui são TASKS DE NOTEBOOK (não pipeline_task): rodam os
# notebooks clássicos em pipelines/classical/**. Cada step espera o predecessor.
#
# As regras de qualidade (Críticas SCR) são criadas pelo usuário na DQX Studio;
# o RC18 apenas LÊ `dq_quality_rules`.

resources:
  jobs:
    rc18_end_to_end:
      name: "r18-end-to-end-${bundle.target}"
      description: "RC18 stack completa (modo clássico, sem SDP/DLT): reference seed + sample XML load + grants, depois bronze → silver → gold via notebooks PySpark."
      max_concurrent_runs: 1

      # Ambiente serverless para as tasks de pipeline (bronze/silver/gold).
      # `lxml` é exigida pelo parser do bronze 3050 (mesma dependência declarada
      # no pipeline DLT). As tasks de setup NÃO usam este environment (mantêm o
      # comportamento idêntico ao setup_job.yml, comprovadamente funcional).
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - lxml

      tasks:
        - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../../notebooks/setup/setup_reference_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.reference.name}

        # Domínios do CADOC 2011 (DDR) — 551 valores dos 7 anexos do leiaute +
        # as views v_dom_2011_* consumidas pelos checks DQX. Notebook GERADO por
        # scripts/gen_ddr2011_reference_seed.py. Depende do setup_reference, que
        # cria a tabela reference.dominios.
        - task_key: "setup_reference_2011"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../../notebooks/setup/setup_reference_2011.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.reference.name}

        - task_key: "load_sample_xmls"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../../notebooks/setup/load_sample_xmls.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              source_dir: ${workspace.file_path}/sample

        - task_key: "grant_warehouse_perms"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            # Concede CAN_USE no warehouse + SQL GRANTs cross-catalog em
            # dqx.dqx_studio.dq_quality_rules para o SP do app. Idempotente.
            notebook_path: ../../notebooks/setup/grant_warehouse_perms.py
            base_parameters:
              app_name: ${resources.apps.r18_compliance_app.name}
              warehouse_name: ${resources.sql_warehouses.rc18_warehouse.name}
              # Catálogo DESTE deployment — obrigatório. Sem ele, um segundo
              # deployment no mesmo workspace grantaria no catálogo do primeiro.
              catalog: ${var.catalog}
              dqx_checks_table: ${var.dqx_checks_table}
              dqx_studio_sp: ${var.dqx_studio_sp}

        # ── Bronze (clássico) ── ingesta os dois CADOCs via Auto Loader batch ──
        - task_key: "bronze_3040"
          depends_on:
            - task_key: "load_sample_xmls"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/bronze/raw_3040.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              bronze_schema: ${resources.schemas.bronze_schema.name}

        - task_key: "bronze_3050"
          depends_on:
            - task_key: "load_sample_xmls"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/bronze/raw_3050.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              bronze_schema: ${resources.schemas.bronze_schema.name}

        # COSIF: uma task por documento (operados de forma independente pelos
        # clientes). Tabelas e checkpoints distintos → rodam em paralelo.
        - task_key: "bronze_4010"
          depends_on:
            - task_key: "load_sample_xmls"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/bronze/raw_4010.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              bronze_schema: ${resources.schemas.bronze_schema.name}

        - task_key: "bronze_4016"
          depends_on:
            - task_key: "load_sample_xmls"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/bronze/raw_4016.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              bronze_schema: ${resources.schemas.bronze_schema.name}

        # CADOC 2011 (DDR) — DIÁRIO. Tabela e checkpoint próprios → paralelo.
        - task_key: "bronze_2011"
          depends_on:
            - task_key: "load_sample_xmls"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/bronze/raw_2011.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              bronze_schema: ${resources.schemas.bronze_schema.name}

        # ── Silver (clássico) ── normaliza cada CADOC após seu bronze ──────────
        - task_key: "silver_3040"
          depends_on:
            - task_key: "bronze_3040"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/silver/scr3040.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}
              reference_schema: ${resources.schemas.reference.name}

        - task_key: "silver_3050"
          depends_on:
            - task_key: "bronze_3050"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/silver/scr3050.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}
              reference_schema: ${resources.schemas.reference.name}

        - task_key: "silver_4010"
          depends_on:
            - task_key: "bronze_4010"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/silver/scr4010.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}

        - task_key: "silver_4016"
          depends_on:
            - task_key: "bronze_4016"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/silver/scr4016.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}

        # Um notebook escreve as TRÊS tabelas silver do 2011.
        - task_key: "silver_2011"
          depends_on:
            - task_key: "bronze_2011"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/silver/scr2011.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}

        # ── Gold (clássico) ── uma task por artefato; cada posição espera SÓ o
        # silver do seu documento ─────────────────────────────────────────────
        - task_key: "gold_3040"
          depends_on:
            - task_key: "silver_3040"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_3040.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "gold_3050"
          depends_on:
            - task_key: "silver_3050"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_3050.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "gold_4010"
          depends_on:
            - task_key: "silver_4010"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_4010.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "gold_4016"
          depends_on:
            - task_key: "silver_4016"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_4016.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        - task_key: "gold_2011"
          depends_on:
            - task_key: "silver_2011"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/posicao_2011.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        # Lê a silver do 2011 (não a posição) → paralelo a gold_2011.
        - task_key: "gold_criticas_2011"
          depends_on:
            - task_key: "silver_2011"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/criticas_ddr_2011.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}

        # Batimento N01. Silver ausente (CADOC fora do deployment) → o notebook
        # sai avisando, sem falhar a run.
        - task_key: "gold_reconciliacao_cosif"
          depends_on:
            - task_key: "silver_3040"
            - task_key: "silver_4010"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/reconciliacao_cosif.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver_schema.name}
              gold_schema: ${resources.schemas.gold_schema.name}
              reference_schema: ${resources.schemas.reference.name}

        # Seletor de Data-Base do app. Tolera posição ausente.
        - task_key: "gold_processing_state"
          depends_on:
            - task_key: "gold_3040"
            - task_key: "gold_3050"
            - task_key: "gold_4010"
            - task_key: "gold_2011"
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../../pipelines/classical/gold/processing_state.py
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${resources.schemas.gold_schema.name}
