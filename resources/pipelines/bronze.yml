# Bronze ingestion pipeline — placeholder
# Will be populated when pipeline code is implemented
resources:
  pipelines:
    bronze:
      name: "r18-bronze-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${resources.schemas.bronze_schema.name}"
      serverless: true
      environment:
        # The XML parser UDFs in raw_3040.py / raw_3050.py import lxml at function
        # scope. Installed via pip into the pipeline's serverless runtime.
        dependencies:
          - lxml
      configuration:
        # Reference the bundle-managed schema by its resolved name, so dev-mode
        # name prefixing (`dev_<user>_landing`) is picked up automatically.
        source_catalog: "${var.catalog}"
        source_schema: "${resources.schemas.landing.name}"
        reference_schema: "${resources.schemas.reference.name}"
      libraries:
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_3040.py
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_3050.py
        # CADOC 4010 (Balancete, mensal) e 4016 (Balanço, semestral) — leiaute XML
        # oficial (IN BCB 469/2024, data-base ≥ jan/2025) via leitor nativo de XML,
        # mais o posicional legado. Um notebook e uma tabela POR DOCUMENTO: os
        # clientes operam os dois de forma independente.
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_4010.py
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_4016.py
        # CADOC 4060 (complemento COSIF) — leitor nativo de XML via leitor
        # nativo de XML (IN BCB X/Y, um notebook e uma tabela POR DOCUMENTO:
        # os clientes operam este de forma independente).
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_4060.py
        # CADOC 2011 (DDR, DIÁRIO) — leitor nativo de XML com schema explícito
        # (o XSD oficial fecha a estrutura, então não precisa da UDF lxml).
        # Uma linha por ARQUIVO: o leiaute tem dois grãos filhos (parametros e
        # contas→detalhamentos) e a silver os abre em três tabelas.
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_2011.py
