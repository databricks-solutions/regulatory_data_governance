# Bronze ingestion pipeline — placeholder
# Will be populated when pipeline code is implemented
resources:
  pipelines:
    bronze:
      name: "r18-bronze-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${resources.schemas.bronze_schema.name}"
      serverless: true
      environment:
        # The XML parser UDFs in raw_3040.py / raw_3050.py import lxml at function
        # scope. Installed via pip into the pipeline's serverless runtime.
        dependencies:
          - lxml
      configuration:
        # Reference the bundle-managed schema by its resolved name, so dev-mode
        # name prefixing (`dev_<user>_landing`) is picked up automatically.
        source_catalog: "${var.catalog}"
        source_schema: "${resources.schemas.landing.name}"
        reference_schema: "${resources.schemas.reference.name}"
      libraries:
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_3040.py
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_3050.py
        # CADOC 4010 (Balancete COSIF) — Auto Loader CSV (tabular, sem XML/lxml).
        - notebook:
            path: ../../pipelines/bronze/transformations/raw_4010.py
