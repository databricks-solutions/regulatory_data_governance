# Gold curation pipeline — produces position tables.
#
# Um notebook por artefato (espelha as tasks de resources/classical/gold.yml).
# Todos no MESMO pipeline: `dlt.read` só resolve dentro de um, e `processing_state`
# depende disso. Remover uma posição do `libraries:` quebra a resolução do grafo.
resources:
  pipelines:
    gold:
      name: "r18-gold-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${resources.schemas.gold_schema.name}"
      serverless: true
      configuration:
        # Resolve every schema via bundle resource references so dev-mode prefixing
        # (`dev_<user>_<name>`) is picked up consistently — both for the gold
        # target and for cross-pipeline reads (gold reads silver via spark.table).
        source_catalog: "${var.catalog}"
        source_schema: "${resources.schemas.bronze_schema.name}"
        bronze_schema: "${resources.schemas.bronze_schema.name}"
        silver_schema: "${resources.schemas.silver_schema.name}"
        gold_schema: "${resources.schemas.gold_schema.name}"
        reference_schema: "${resources.schemas.reference.name}"
      libraries:
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_3040.py
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_3050.py
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_4010.py
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_4016.py
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_4060.py
        - notebook:
            path: ../../pipelines/gold/transformations/posicao_2011.py
        - notebook:
            path: ../../pipelines/gold/transformations/criticas_ddr_2011.py
        - notebook:
            path: ../../pipelines/gold/transformations/reconciliacao_cosif.py
        - notebook:
            path: ../../pipelines/gold/transformations/criticas_cosif_4060.py
        - notebook:
            path: ../../pipelines/gold/transformations/processing_state.py
