# End-to-end orchestration job for the RC18 accelerator — SDP/DLT MODE.
#
# Só é deployado quando `resources/pipelines/*.yml` está descomentado no
# `include:` do databricks.yml (pipeline_mode: sdp). No modo classical (default)
# o equivalente é `rc18_end_to_end_classical` em resources/classical/.
#
# Chains the existing assets in dependency order so a single
# `databricks bundle run rc18_end_to_end` brings the whole stack
# from a fresh deploy to populated gold tables:
#
#   setup_reference  ┬─→  load_sample_xmls  →  bronze  →  silver  →  gold
#                    └─→  grant_warehouse_perms (paralelo)
#
# Cada step espera o predecessor concluir com sucesso. As DLT pipelines são
# referenciadas via bundle resource IDs para o prefixing dev-mode ser aplicado
# automaticamente.
#
# As regras de qualidade (Críticas SCR) são criadas pelo usuário na DQX Studio;
# o RC18 apenas LÊ `dq_quality_rules`. Não há mais seed automático de regras.

resources:
  jobs:
    rc18_end_to_end:
      name: "r18-end-to-end-${bundle.target}"
      description: "Runs the full RC18 stack: reference seed + sample XML load + DQX rules seed, then bronze → silver → gold DLT pipelines."
      tasks:
        - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../../notebooks/setup/setup_reference_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.reference.name}

        - task_key: "load_sample_xmls"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../../notebooks/setup/load_sample_xmls.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              source_dir: ${workspace.file_path}/sample

        - task_key: "grant_warehouse_perms"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            # Concede CAN_USE no warehouse + SQL GRANTs cross-catalog em
            # dqx.dqx_studio.dq_quality_rules para o SP do app. Necessário
            # porque `bundle destroy` recria o SP a cada ciclo e nem o ACL do
            # warehouse nem os grants no catálogo DQX persistem. Idempotente.
            notebook_path: ../../notebooks/setup/grant_warehouse_perms.py
            base_parameters:
              app_name: ${resources.apps.r18_compliance_app.name}
              warehouse_name: ${resources.sql_warehouses.rc18_warehouse.name}
              dqx_checks_table: ${var.dqx_checks_table}

        - task_key: "bronze"
          depends_on:
            - task_key: "load_sample_xmls"
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze.id}

        - task_key: "silver"
          depends_on:
            - task_key: "bronze"
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}

        - task_key: "gold"
          depends_on:
            - task_key: "silver"
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold.id}
