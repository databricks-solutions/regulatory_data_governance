# Silver validation pipeline — placeholder
resources:
  pipelines:
    silver:
      name: "r18-silver-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${resources.schemas.silver_schema.name}"
      configuration:
        # Resolve every schema via bundle resource references so dev-mode prefixing
        # (`dev_<user>_<name>`) is picked up consistently — both for the silver
        # target and for cross-pipeline reads (silver reads bronze tables).
        source_catalog: "${var.catalog}"
        source_schema: "${resources.schemas.bronze_schema.name}"
        silver_schema: "${resources.schemas.silver_schema.name}"
        reference_schema: "${resources.schemas.reference.name}"
      libraries:
        - notebook:
            path: ../../pipelines/silver/transformations/expectations.py
        - notebook:
            path: ../../pipelines/silver/transformations/quality_metrics.py
        - notebook:
            path: ../../pipelines/silver/transformations/scr3040_validated.py
        - notebook:
            path: ../../pipelines/silver/transformations/scr3050_validated.py
