# Silver validation pipeline — pure ELT (quality runs externally in DQX Studio).
resources:
  pipelines:
    silver:
      name: "r18-silver-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${resources.schemas.silver_schema.name}"
      serverless: true
      configuration:
        # Resolve every schema via bundle resource references so dev-mode prefixing
        # (`dev_<user>_<name>`) is picked up consistently — both for the silver
        # target and for cross-pipeline reads (silver reads bronze tables).
        source_catalog: "${var.catalog}"
        source_schema: "${resources.schemas.bronze_schema.name}"
        silver_schema: "${resources.schemas.silver_schema.name}"
        reference_schema: "${resources.schemas.reference.name}"
      libraries:
        # Pipeline notebooks — files with @dlt.table decorators. Pure ELT
        # bronze→silver transforms; nenhuma quality logic embutida (DQX Studio
        # gerencia quality fora dos pipelines).
        - notebook:
            path: ../../pipelines/silver/transformations/scr3040.py
        - notebook:
            path: ../../pipelines/silver/transformations/scr3050.py
        # COSIF: um notebook por documento — scr4010_saldos (Balancete, mensal)
        # e scr4016_saldos (Balanço, semestral).
        - notebook:
            path: ../../pipelines/silver/transformations/scr4010.py
        - notebook:
            path: ../../pipelines/silver/transformations/scr4016.py
