# One-time setup job for a fresh deploy of the implementation bundle.
#
# Two tasks:
#   1. setup_reference     — seeds rc18_catalog.reference with BCB domains, criticas,
#                            calendar, equivalencia, R.18 dimensions. Idempotent:
#                            CREATE TABLE IF NOT EXISTS + INSERTs on natural keys.
#   2. load_sample_xmls    — copies sample/Doc3040_*.xml and sample/Doc3050_*.xml
#                            into ${var.catalog}.landing.scr_xml/{3040,3050}/, so the
#                            bronze pipelines have data to ingest end-to-end.
#                            Skip if you don't want sample data in the landing volume.
#
# Run order on a fresh deployment:
#   1. databricks bundle deploy             # provisions catalog, schemas, volumes, pipelines, app
#   2. databricks bundle run setup          # seeds reference + loads sample XMLs
#   3. databricks bundle run bronze_ingestion       # then silver_validation, gold_reconciliation
#   4. databricks bundle run r18_compliance_app     # push code into the app container

resources:
  jobs:
    setup_reference_tables:
      name: "r18-setup-${bundle.target}"
      description: "Seeds rc18_catalog.reference with BCB domains/criticas/calendar/equivalencia/R.18 dimensions, then loads the canonical Doc 3040/3050 sample XMLs into the landing volume. Run once after `bundle deploy`. Idempotent."
      tasks:
        - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../notebooks/setup/setup_reference_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.reference.name}

        - task_key: "load_sample_xmls"
          depends_on:
            - task_key: "setup_reference"
          notebook_task:
            notebook_path: ../notebooks/setup/load_sample_xmls.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${resources.schemas.landing.name}
              source_dir: ${workspace.file_path}/sample
