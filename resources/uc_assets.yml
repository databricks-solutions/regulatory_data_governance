# Unity Catalog schemas and volumes that the RC18 pipelines depend on.
#
# Schema names são literais (`bronze`, `silver`, `gold`, `reference`, `landing`)
# — o `dev` target NÃO usa `mode: development`, então não há prefixo
# `dev_<user>_` aplicado pelo DABs. Pipelines DLT e o app leem esses mesmos
# nomes via `${var.schema_*}` ou via referência direta ao recurso
# (`${resources.schemas.<name>.name}`).
#
# O catálogo em si NÃO é declarado no core. Para demos ele vive em
# `demo/resources/catalog.yml`; clientes fornecem um catálogo existente
# via `${var.catalog}`.
#
# Quality lifecycle (autoria de regras + execução) vive fora deste bundle, no
# DQX Studio (Databricks App externa do Databricks Labs DQX) — embarcado via
# iframe na rota `/rules` do app RC18 quando `DQX_STUDIO_URL` está setado.

resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: landing
      comment: "Landing zone — raw SCR Doc 3040/3050 XML files, COSIF parquet, and Auto Loader schema/checkpoint state."

    reference:
      catalog_name: ${var.catalog}
      name: reference
      comment: "Reference data — BCB domains, criticas (validation rules), business-day calendar, modalidade equivalencia 3040↔3050, R.18 dimensions. Seeded by the setup_reference_tables job."

    bronze_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_bronze}
      comment: "Bronze — raw XML parsed into typed structs, one row per file (raw_3040_doc, raw_3050_doc)."

    silver_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_silver}
      comment: "Silver — normalized SCR tables (scr3040_operacoes, scr3040_clientes, scr3040_garantias, scr3040_vencimentos, scr3040_cont_4966; scr3050 unified). Pure ELT — quality runs externally in DQX Studio."

    gold_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_gold}
      comment: "Gold — curated tables for App + dashboards (posicao_3040, posicao_3050)."

  volumes:
    scr_xml:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: scr_xml
      volume_type: MANAGED
      comment: "Inbox for SCR XML submissions — Doc3040_*.xml under scr_xml/3040/, Doc3050_*.xml under scr_xml/3050/. The bronze pipeline auto-loads from here."

    checkpoints:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: _checkpoints
      volume_type: MANAGED
      comment: "Auto Loader schema-evolution and checkpoint state for bronze streaming ingestion. Do not delete while pipelines are running."
