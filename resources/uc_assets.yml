# Unity Catalog schemas and volumes that the RC18 pipelines depend on.
#
# All schemas are declared here so DABs `mode: development` prefixing
# (`dev_<user>_<name>`) is applied consistently across:
#   - the schema CREATE itself,
#   - each DLT pipeline's `schema:` target, and
#   - each pipeline's `configuration` block where downstream pipelines need the
#     schema name (gold reads silver via spark.table, etc.).
#
# Without this, in dev mode the silver pipeline target gets prefixed to
# `dev_<user>_silver` while a config value of `${var.schema_silver}` = `silver`
# still resolves to plain `silver` — which makes gold read an empty schema.
#
# The catalog itself is NOT declared in core. For demos it lives in
# `demo/resources/catalog.yml`; for customer deployments the customer
# provides an existing catalog via `${var.catalog}`.

resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: landing
      comment: "Landing zone — raw SCR Doc 3040/3050 XML files, COSIF parquet, and Auto Loader schema/checkpoint state."

    reference:
      catalog_name: ${var.catalog}
      name: reference
      comment: "Reference data — BCB domains, criticas (validation rules), business-day calendar, modalidade equivalencia 3040↔3050, R.18 dimensions. Seeded by the setup_reference_tables job."

    bronze_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_bronze}
      comment: "Bronze — raw XML parsed into typed structs, one row per file (raw_3040_doc, raw_3050_doc)."

    silver_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_silver}
      comment: "Silver — validated/normalized SCR tables (operacoes_validadas, scr3040_*, scr3050_validated, quarantine) + per-run quality_scorecard / criticas_results."

    gold_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_gold}
      comment: "Gold — curated tables for App + dashboards (posicao_mensal_3040, posicao_3050, qualidade_dimensoes_mensal, violacoes_log)."

  volumes:
    scr_xml:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: scr_xml
      volume_type: MANAGED
      comment: "Inbox for SCR XML submissions — Doc3040_*.xml under scr_xml/3040/, Doc3050_*.xml under scr_xml/3050/. The bronze pipeline auto-loads from here."

    checkpoints:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: _checkpoints
      volume_type: MANAGED
      comment: "Auto Loader schema-evolution and checkpoint state for bronze streaming ingestion. Do not delete while pipelines are running."
