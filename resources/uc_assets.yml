# Unity Catalog schemas and volumes that the RC18 pipelines depend on.
#
# Schema names são literais (`bronze`, `silver`, `gold`, `reference`, `landing`,
# `quality`) — o `dev` target NÃO usa `mode: development`, então não há prefixo
# `dev_<user>_` aplicado pelo DABs. Pipelines DLT e o app leem esses mesmos
# nomes via `${var.schema_*}` ou via referência direta ao recurso
# (`${resources.schemas.<name>.name}`).
#
# O catálogo em si NÃO é declarado no core. Para demos ele vive em
# `demo/resources/catalog.yml`; clientes fornecem um catálogo existente
# via `${var.catalog}`.
#
# Quality lifecycle (autoria de regras + execução) vive fora deste bundle, no
# DQX Studio (pré-requisito obrigatório, deployado separadamente) — embarcado
# via iframe na rota `/rules` usando a URL obrigatória definida no target. As
# regras e o histórico de execução são de propriedade da DQX Studio (tabelas
# `dq_quality_rules`/`dq_validation_runs`/`dq_metrics` em `${var.dqx_catalog}`);
# o app RC18 apenas as LÊ. O schema `quality` abaixo permanece disponível para
# artefatos locais de qualidade, mas não é mais semeado por nenhum job.

resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: landing
      comment: "Landing zone — raw SCR Doc 3040/3050 XML, COSIF Doc 4010/4016 XML (+ legacy positional .txt), and Auto Loader schema/checkpoint state."

    reference:
      catalog_name: ${var.catalog}
      name: reference
      comment: "Reference data — BCB domains, criticas (validation rules), business-day calendar, modalidade equivalencia 3040↔3050, R.18 dimensions. Seeded by the setup_reference_tables job."

    bronze_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_bronze}
      comment: "Bronze — raw XML parsed into typed structs, one row per file (raw_3040_doc, raw_3050_doc); COSIF balances, one row per account, one table per document (raw_4010_saldos, raw_4016_saldos)."

    silver_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_silver}
      comment: "Silver — normalized SCR tables (scr3040_operacoes, scr3040_clientes, scr3040_garantias, scr3040_vencimentos, scr3040_cont_4966; scr3050 unified; scr4010_saldos + scr4016_saldos COSIF). Pure ELT — quality runs externally in DQX Studio."

    gold_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema_gold}
      comment: "Gold — curated tables for App + dashboards (posicao_3040, posicao_3050, posicao_4010, posicao_4016, reconciliacao_cosif, processing_state)."

    quality:
      catalog_name: ${var.catalog}
      name: ${var.schema_quality}
      comment: "Quality — schema reservado para artefatos locais de qualidade. As regras e métricas autoritativas são de propriedade da DQX Studio (schema ${var.dqx_schema} no catálogo ${var.dqx_catalog}); o app RC18 apenas as lê."

    governance:
      catalog_name: ${var.catalog}
      name: governance
      comment: "Governance — incidents (R.18 Art.2 §3 audit log). Written by app's POST /governance/incidents + auto-emit job pós-silver."

  volumes:
    scr_xml:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: scr_xml
      volume_type: MANAGED
      comment: "Inbox for submissions — Doc3040_*.xml under scr_xml/3040/, Doc3050_*.xml under scr_xml/3050/, Doc4010_*.xml (COSIF Balancete, mensal) under scr_xml/4010/, Doc4016_*.xml (COSIF Balanco, semestral) under scr_xml/4016/. Legacy positional Doc40*.txt (data-base < jan/2025) live in the same COSIF subfolders. The bronze pipeline auto-loads from here."

    checkpoints:
      catalog_name: ${var.catalog}
      schema_name: landing
      name: _checkpoints
      volume_type: MANAGED
      comment: "Auto Loader schema-evolution and checkpoint state for bronze streaming ingestion. Do not delete while pipelines are running."
