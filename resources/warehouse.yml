# Serverless SQL warehouse provisioned by the implementation bundle.
# Used by the Lakeview dashboards, the app's SQL queries, and any ad-hoc
# analysis. Defaults to a 2X-Small with auto-stop after 10 min so the cost
# of an idle deploy is minimal.
#
# Customers who already own a warehouse should override --var warehouse_id=<id>
# AND comment out this resource so the bundle does not provision a duplicate.
resources:
  sql_warehouses:
    rc18_warehouse:
      name: rc18-warehouse-${bundle.target}
      cluster_size: "2X-Small"
      warehouse_type: PRO
      enable_serverless_compute: true
      auto_stop_mins: 10
      min_num_clusters: 1
      max_num_clusters: 1
