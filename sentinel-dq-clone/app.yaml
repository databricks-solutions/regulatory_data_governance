command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "c0bae51c5113e9a4"
  - name: DATABRICKS_CATALOG
    value: "santander_credito_app_catalog"
  - name: PGHOST
    value: "instance-2636b0d8-adc5-4751-9d40-635a8d38d3f6.database.cloud.databricks.com"
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "databricks_postgres"
resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "c0bae51c5113e9a4"
      permission: CAN_USE
  - name: sentinel-db
    database:
      instance_name: "sentinel-db"
      database_name: "databricks_postgres"
      permission: CAN_CONNECT_AND_CREATE
